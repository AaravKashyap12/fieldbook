# Once a day: take an install-count snapshot, re-run the automated review on
# every listed SKILL.md, rebuild, check, and commit the new data. The push
# triggers the Vercel deployment. A new, uncleared scanner flag
# pauses that listing automatically (see scripts/build.mjs).
name: Daily snapshot

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to full commit SHAs (checkout v7.0.1, setup-node v7.0.0).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Snapshot, review, build and check
        env:
          SYNC_GAP_MS: '2100'
          SITE_URL: https://fieldbook.tech
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run daily
      - name: Commit data
        run: |
          git config user.name "fieldbook-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/stats content/review.json vercel.json
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "Daily snapshot $(date -u +%F)"
          git push
