# Every pull request and push to main: build the site and run the
# security, content and SEO checks. Offline; no secrets or provider calls.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions are pinned to full commit SHAs (checkout v7.0.1, setup-node v7.0.0).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Build
        run: npm run build
      - name: Security, content and SEO checks
        run: npm run check
